name: roboshop

services:

  mongodb:
    build: ./mongodb
    image: mongodb:v1
    container_name: mongodb
    volumes:
      - mongodb:/data/db

  catalogue:
    build: ./catalogue
    image: catalogue:v1
    container_name: catalogue
    depends_on:
      - mongodb
    environment:
      - MONGO: "true"
      - MONGO_URL: "mongodb://mongodb:27017/catalogue"

  frontend:
    build: ./FRONTEND
    image: frontend:v1
    container_name: frontend
    ports:
      - "81:80"
    depends_on:
      - catalogue
      - user
      - cart
      - shipping
      - payment
  user:
    build: ./user
    image: user:v1
    container_name: user
    depends_on:
      - redis
      - mongodb
    environment:
      MONGO: "true"
      REDIS_URL: "redis://redis:6379"
      MONGO_URL: "mongodb://mongodb:27017/users"

  cart:
    build: ./cart
    image: cart:v1
    container_name: cart
    depends_on:
      - redis
      - catalogue
    environment:
      REDIS_HOST: "redis"
      CATALOGUE_HOST: "catalogue"
      CATALOGUE_PORT: "8080"

  redis:
    image: redis:7
    container_name: redis
    volumes:
      - redis:/data

  mysql:
    build: ./mysql
    image: mysql:v1
    container_name: mysql
    #command: --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: "RoboShop@1"
    volumes:
      - mysql:/var/lib/mysql

  shipping:
    build: ./shipping
    image: shipping:v1
    container_name: shipping
    depends_on:
      - cart
      - mysql
    environment:
      CART_ENDPOINT: "cart:8080"
      DB_HOST: "mysql"
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      
  payment:
    build: ./payment
    image: payment:v1
    container_name: payment
    depends_on:
      - rabbitmq
      - cart
      - user
    environment:
      CART_HOST : cart
      CART_PORT : 8080
      USER_HOST : user
      USER_PORT : 8080
      AMQP_HOST : rabbitmq
      AMQP_USER : roboshop
      AMQP_PASS : roboshop123

networks:
  default:
    name: roboshop
    driver: bridge
    #external: false
volumes:
  mongodb: #docker volume create mongodb
  cart : #docker volume create cart
  catalogue : #docker volume create catalogue
  user:  #docker volume create user